<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sensor Node Dashboard</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#1c2430;--muted:#6b7686;--line:#d5dbe4;--tc:#e0503c;--hc:#2b7fd4}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--card:#1a212b;--text:#e6ebf2;--muted:#8d99aa;--line:#2f3a48}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px}
h1{font-size:1.3rem;margin:0}
#status{font-size:.9rem;color:var(--muted);display:flex;align-items:center;gap:8px}
#dot{width:10px;height:10px;border-radius:50%;background:#999}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.card h2{font-size:.95rem;font-weight:600;color:var(--muted);margin:0 0 8px;text-transform:uppercase;letter-spacing:.05em}
.wide{grid-column:1/-1}
.big{font-size:2rem;font-weight:700;margin-top:4px}
.sub{font-size:.85rem;color:var(--muted);margin-top:4px}
svg{max-width:100%;height:auto}
.paused .v{opacity:.55}
.legend{display:flex;gap:16px;justify-content:center;font-size:.85rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:6px}
#err{color:#e0503c;margin:0 0 12px;display:none}
.ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center;margin-top:8px}
.ctl input[type=password]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);min-width:230px}
button{padding:9px 18px;border:0;border-radius:8px;font-weight:600;cursor:pointer;color:#fff}
#bPause{background:#e0a030}#bResume{background:#2fb36a}
button:disabled{opacity:.5;cursor:not-allowed}
label{font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<main>
  <header>
    <h1>Sensor Node Dashboard</h1>
    <div id="status"><span id="dot"></span><span id="statusText">Loading...</span></div>
  </header>
  <p id="err"></p>

  <div class="grid" id="grid">
    <section class="card v">
      <h2>Temperature</h2>
      <svg viewBox="0 0 140 300" width="140" role="img" aria-label="Thermometer">
        <rect x="45" y="15" width="30" height="215" rx="15" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
        <circle cx="60" cy="252" r="32" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
        <rect id="mercury" x="52" y="240" width="16" height="0" fill="#999"/>
        <circle id="bulb" cx="60" cy="252" r="24" fill="#999"/>
        <g id="ticks" font-size="11" fill="var(--muted)"></g>
      </svg>
      <div class="big" id="tempVal">--</div>
      <div class="sub" id="tempRange">&nbsp;</div>
    </section>

    <section class="card v">
      <h2>Humidity</h2>
      <svg viewBox="0 0 200 125" width="280" role="img" aria-label="Humidity gauge">
        <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="var(--line)" stroke-width="16" stroke-linecap="round"/>
        <path id="humArc" d="M 20 100 A 80 80 0 0 1 20 100" fill="none" stroke="#999" stroke-width="16" stroke-linecap="round"/>
        <text x="20" y="120" font-size="10" fill="var(--muted)" text-anchor="middle">0</text>
        <text x="100" y="22" font-size="10" fill="var(--muted)" text-anchor="middle">50</text>
        <text x="180" y="120" font-size="10" fill="var(--muted)" text-anchor="middle">100</text>
      </svg>
      <div class="big" id="humVal">--</div>
      <div class="sub" id="humNote">&nbsp;</div>
    </section>

    <section class="card wide v">
      <h2>Trend</h2>
      <svg id="chart" viewBox="0 0 600 200" width="100%" role="img" aria-label="Temperature and humidity trend"></svg>
      <div class="legend">
        <span><i style="background:var(--tc)"></i>Temperature (left, &deg;C)</span>
        <span><i style="background:var(--hc)"></i>Humidity (right, %)</span>
      </div>
    </section>

    <section class="card wide">
      <h2>Node control</h2>
      <div class="ctl">
        <input type="password" id="key" placeholder="Control channel write key" autocomplete="off">
        <button id="bPause">Pause node</button>
        <button id="bResume">Resume node</button>
      </div>
      <div class="ctl"><label><input type="checkbox" id="remember"> Remember key on this device</label></div>
      <div class="sub" id="cmdState">&nbsp;</div>
      <div class="sub" id="msg">The key is never stored in this page's code. Paste it here to send commands.</div>
    </section>
  </div>
</main>

<script>
// ---------- CONFIG ----------
const CONFIG = {
  channelId: 3532567,        // your DATA channel ID
  controlChannelId: 3532622, // your CONTROL channel ID (make it public so the page can show the last command)
  controlWriteKey: "RQAP3J5Z3QOK92NY", // CONTROL channel WRITE API key. Anyone who can open this page can read it in the source!
                       // Leave empty to paste the key into the page instead.
  readKey: "1BZ6YR3OBMQ44BUA",         // empty for a public channel (a key here is visible to anyone)
  results: 200,        // recent entries to load (max 8000)
  refreshMs: 20000,
  staleSec: 120,       // "Offline" if no entry (including heartbeats) for this long
  tMin: 0, tMax: 50    // thermometer scale in °C
};

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
let lastTime = null, running = null, pending = null, cooldownUntil = 0;

// Thermometer scale
const TY0 = 240, TH = 215;
const yOf = t => TY0 - clamp((t - CONFIG.tMin) / (CONFIG.tMax - CONFIG.tMin), 0, 1) * TH;
(function () {
  let s = "";
  for (let t = CONFIG.tMin; t <= CONFIG.tMax; t += 10) {
    const y = yOf(t);
    s += `<line x1="80" x2="88" y1="${y}" y2="${y}" stroke="var(--muted)"/><text x="94" y="${y + 4}">${t}</text>`;
  }
  $("ticks").innerHTML = s;
})();

function setTemp(t) {
  const frac = clamp((t - CONFIG.tMin) / (CONFIG.tMax - CONFIG.tMin), 0, 1);
  const col = `hsl(${210 - frac * 210} 80% 50%)`;
  const y = yOf(t);
  $("mercury").setAttribute("y", y);
  $("mercury").setAttribute("height", 245 - y);
  $("mercury").setAttribute("fill", col);
  $("bulb").setAttribute("fill", col);
  $("tempVal").textContent = t.toFixed(1) + " °C";
}

function setHum(h) {
  const v = clamp(h, 0, 100);
  const a = Math.PI * (1 - Math.max(v, 0.5) / 100);
  const x = 100 + 80 * Math.cos(a), y = 100 - 80 * Math.sin(a);
  const col = v < 30 ? "#e0a030" : v <= 60 ? "#2fb36a" : v <= 75 ? "#e0a030" : "#e0503c";
  $("humArc").setAttribute("d", `M 20 100 A 80 80 0 0 1 ${x.toFixed(2)} ${y.toFixed(2)}`);
  $("humArc").setAttribute("stroke", col);
  $("humVal").textContent = h.toFixed(1) + " %";
  $("humNote").textContent = v < 30 ? "Dry" : v <= 60 ? "Comfortable range (30-60%)" : v <= 75 ? "Humid" : "Very humid";
}

function drawChart(pts) {
  if (pts.length < 2) { $("chart").innerHTML = ""; return; }
  const W = 600, H = 200, L = 38, R = 38, T = 10, B = 22;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const range = k => {
    let lo = Math.min(...pts.map(p => p[k])), hi = Math.max(...pts.map(p => p[k]));
    if (hi - lo < 1) { lo -= 0.5; hi += 0.5; }
    const pad = (hi - lo) * 0.1;
    return [lo - pad, hi + pad];
  };
  const [tl, th] = range("temp"), [hl, hh] = range("hum");
  const x = t => L + (t - t0) / (t1 - t0 || 1) * (W - L - R);
  const yy = (v, lo, hi) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const path = (k, lo, hi) => pts.map((p, i) => (i ? "L" : "M") + x(p.t).toFixed(1) + " " + yy(p[k], lo, hi).toFixed(1)).join(" ");
  let s = "";
  for (let i = 0; i <= 3; i++) {
    const y = T + i / 3 * (H - T - B);
    s += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 3"/>`;
    s += `<text x="${L - 4}" y="${y + 3}" font-size="10" fill="var(--tc)" text-anchor="end">${(th - i / 3 * (th - tl)).toFixed(1)}</text>`;
    s += `<text x="${W - R + 4}" y="${y + 3}" font-size="10" fill="var(--hc)">${(hh - i / 3 * (hh - hl)).toFixed(0)}</text>`;
  }
  const fmt = t => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  s += `<text x="${L}" y="${H - 6}" font-size="10" fill="var(--muted)">${fmt(t0)}</text>`;
  s += `<text x="${W - R}" y="${H - 6}" font-size="10" fill="var(--muted)" text-anchor="end">${fmt(t1)}</text>`;
  s += `<path d="${path("hum", hl, hh)}" fill="none" stroke="var(--hc)" stroke-width="2"/>`;
  s += `<path d="${path("temp", tl, th)}" fill="none" stroke="var(--tc)" stroke-width="2"/>`;
  $("chart").innerHTML = s;
}

function updateStatus() {
  if (lastTime == null) return;
  const age = Math.round((Date.now() - lastTime) / 1000);
  const stale = age > CONFIG.staleSec;
  const label = stale ? "Offline" : running === false ? "Paused" : "Live";
  $("dot").style.background = stale ? "#e0503c" : running === false ? "#e0a030" : "#2fb36a";
  $("statusText").textContent = `${label} - last update ` + (age < 90 ? age + " s" : Math.round(age / 60) + " min") + " ago";
  $("grid").classList.toggle("paused", !stale && running === false);
}

const msg = t => { $("msg").textContent = t; };

async function load() {
  try {
    const url = `https://api.thingspeak.com/channels/${CONFIG.channelId}/feeds.json?results=${CONFIG.results}` +
      (CONFIG.readKey ? `&api_key=${CONFIG.readKey}` : "");
    const r = await fetch(url);
    if (!r.ok) throw new Error("ThingSpeak returned HTTP " + r.status + " (check channel ID / read key)");
    const feeds = (await r.json()).feeds || [];
    if (!feeds.length) throw new Error("No entries in the channel yet");

    const lastFeed = feeds[feeds.length - 1];
    lastTime = new Date(lastFeed.created_at).getTime();
    const flag = parseFloat(lastFeed.field3);
    running = flag === 1 ? true : flag === 0 ? false : null;

    const pts = feeds.map(f => ({ t: new Date(f.created_at).getTime(), temp: parseFloat(f.field1), hum: parseFloat(f.field2) }))
      .filter(p => !isNaN(p.temp) && !isNaN(p.hum));
    if (pts.length) {
      const last = pts[pts.length - 1];
      setTemp(last.temp); setHum(last.hum); drawChart(pts);
      const temps = pts.map(p => p.temp);
      $("tempRange").textContent = `Min ${Math.min(...temps).toFixed(1)} / Max ${Math.max(...temps).toFixed(1)} °C (${pts.length} readings)`;
    } else {
      $("tempRange").textContent = "No temperature readings in the recent data";
    }

    if (pending) {
      if (running === (pending.want === 1)) { msg(pending.want ? "Node confirmed: running." : "Node confirmed: paused."); pending = null; }
      else if (Date.now() - pending.at > 75000) { msg("No confirmation yet. Check the write key and that the node is online."); pending = null; }
    }
    $("err").style.display = "none";
    updateStatus();
  } catch (e) {
    $("err").textContent = "Could not load data: " + e.message;
    $("err").style.display = "block";
  }
}

async function loadCmd() {
  if (!CONFIG.controlChannelId) return;
  try {
    const r = await fetch(`https://api.thingspeak.com/channels/${CONFIG.controlChannelId}/feeds/last.json`);
    if (!r.ok) return;
    const j = await r.json();
    const v = parseFloat(j.field1);
    if (isNaN(v)) return;
    const mins = Math.round((Date.now() - new Date(j.created_at).getTime()) / 60000);
    $("cmdState").textContent = `Last command on control channel: ${v === 0 ? "PAUSE" : "RUN"} (${mins < 1 ? "just now" : mins + " min ago"})`;
  } catch (e) {}
}

async function send(want) {
  const key = (CONFIG.controlWriteKey || $("key").value).trim();
  if (!key) { msg("Set controlWriteKey in CONFIG, or enter the write key above."); return; }
  if (Date.now() < cooldownUntil) { msg("Wait about 15 s between commands (ThingSpeak limit)."); return; }
  try {
    if ($("remember").checked) localStorage.setItem("ctrlKey", key); else localStorage.removeItem("ctrlKey");
  } catch (e) {}
  cooldownUntil = Date.now() + 16000;
  pending = { want, at: Date.now() };
  msg(want ? "Resume sent, waiting for the node to confirm (up to ~40 s)..." : "Pause sent, waiting for the node to confirm (up to ~40 s)...");
  try {
    // no-cors: the response can't be read, so confirmation comes from the node's own heartbeat
    await fetch(`https://api.thingspeak.com/update?api_key=${encodeURIComponent(key)}&field1=${want}`, { mode: "no-cors" });
    setTimeout(loadCmd, 2500);
  } catch (e) {
    pending = null; cooldownUntil = 0;
    msg("Network error while sending the command.");
  }
}

try {
  const k = localStorage.getItem("ctrlKey");
  if (k) { $("key").value = k; $("remember").checked = true; }
} catch (e) {}
if (CONFIG.controlWriteKey) {
  $("key").style.display = "none";
  $("remember").closest(".ctl").style.display = "none";
  msg("Write key is set in the page's CONFIG.");
}
$("bPause").onclick = () => send(0);
$("bResume").onclick = () => send(1);

load();
loadCmd();
setInterval(loadCmd, 15000);
setInterval(load, CONFIG.refreshMs);
setInterval(() => { if (pending) load(); }, 5000);
setInterval(updateStatus, 1000);
</script>
</body>
</html>
